name: Build ChatGPT Prompts EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AutoHotkey v2
        run: |
          choco install autohotkey.portable --version=2.0.11 -y
      - name: Build exe
        shell: powershell
        run: ./scripts/build-exe.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTPrompts
          path: dist/ChatGPTPrompts.exe
